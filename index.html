<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101323">
  <title>Tic-Tac-Toe — Play & Win</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="eyebrow">THE CLASSIC GAME</div>
      <h1>Tic<span>·</span>Tac<span>·</span>Toe</h1>
      <p>Three in a row. One legendary victory.</p>
    </header>

    <section class="panel" aria-label="Game">
      <div class="topbar">
        <label class="mode-label" for="mode">GAME MODE</label>
        <select id="mode" aria-label="Choose game mode">
          <option value="computer">Play vs Computer</option>
          <option value="local">Two Players</option>
        </select>
      </div>

      <div class="scoreboard">
        <div class="score active" id="score-x">
          <span class="player-mark x">X</span><span class="player-name">PLAYER X</span>
          <strong id="x-score">0</strong>
        </div>
        <div class="score" id="score-o">
          <span class="player-mark o">O</span><span class="player-name" id="o-label">COMPUTER</span>
          <strong id="o-score">0</strong>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Your turn — make a move!</div>
      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
        <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, column 1"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, column 2"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, column 3"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, column 1"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, column 2"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, column 3"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, column 1"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, column 2"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, column 3"></button>
      </div>
      <div class="actions">
        <button class="btn primary" id="restart">↻ Restart Round</button>
        <button class="btn secondary" id="reset-scores">Reset Scores</button>
      </div>
    </section>
    <footer>Made with <span>♥</span> and JavaScript · <a href="https://github.com/" target="_blank" rel="noreferrer">GitHub project</a></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
